defaults: _base.yaml
train:
  num_train_epochs: 1
  learning_rate: 5.0e-6
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_steps: 0.1  # <1 = ratio of total steps
  per_device_train_batch_size: 8  # completions, i.e. 2 prompts x 4 generations
  gradient_accumulation_steps: 1
  num_generations: 4
  num_iterations: 2
  temperature: 0.9
  top_p: 0.95
  top_k: 0
  repetition_penalty: 1.0
  max_completion_length: 512
  beta: 0.04
  epsilon: 0.2
  loss_type: grpo
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  save_steps: 500
  save_total_limit: 2  # each full checkpoint is ~10 GB with optimizer state
  seed: 42